<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sternenkarte Wädenswil</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #001020;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background: #000;
      outline: none;
    }

    #content {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #skyframe {
      display: block;
      border: 0;
      background: #000;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.35;
      user-select: none;
    }

    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
    }

    #controls button {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(20,20,20,0.85);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #controls button:hover {
      background: rgba(45,45,45,0.95);
    }
  </style>
</head>
<body>
  <div id="hud">
    Zoom: <span id="zoomLabel">100%</span><br>
    Tasten: + / - / 0 / Pfeile
  </div>

  <div id="controls">
    <button id="zoomOutBtn" aria-label="Verkleinern">−</button>
    <button id="resetBtn" aria-label="Zurücksetzen">100%</button>
    <button id="zoomInBtn" aria-label="Vergrössern">+</button>
  </div>

  <div id="viewport" tabindex="0">
    <div id="content">
      <iframe id="skyframe" title="Sternenkarte Wädenswil"></iframe>
    </div>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const content = document.getElementById('content');
    const frame = document.getElementById('skyframe');
    const zoomLabel = document.getElementById('zoomLabel');

    let zoom = 1;
    const minZoom = 1;
    const maxZoom = 3;
    const zoomStep = 0.25;

    function buildAstroViewerUrl(size) {
      const params = new URLSearchParams({
        lon: '8.6687',
        lat: '47.2267',
        name: 'Wädenswil',
        tz: 'Europe/Zurich',
        lang: 'de',
        bgColor: '000000',
        size: String(size),
        deco: '15'
      });

      return `https://astroviewer.net/av/widgets/skymap-av4-widget.php?${params.toString()}`;
    }

    function renderMap(keepCenter = true) {
      const oldWidth = content.offsetWidth || window.innerWidth;
      const oldHeight = content.offsetHeight || window.innerHeight;
      const oldCenterX = viewport.scrollLeft + viewport.clientWidth / 2;
      const oldCenterY = viewport.scrollTop + viewport.clientHeight / 2;

      const width = Math.round(window.innerWidth * zoom);
      const height = Math.round(window.innerHeight * zoom);

      content.style.width = width + 'px';
      content.style.height = height + 'px';

      frame.style.width = width + 'px';
      frame.style.height = height + 'px';

      const astroSize = Math.max(width, height);
      const newSrc = buildAstroViewerUrl(astroSize);

      if (frame.src !== newSrc) {
        frame.src = newSrc;
      }

      zoomLabel.textContent = Math.round(zoom * 100) + '%';

      if (keepCenter) {
        const ratioX = oldCenterX / oldWidth;
        const ratioY = oldCenterY / oldHeight;

        requestAnimationFrame(() => {
          viewport.scrollLeft = Math.max(0, width * ratioX - viewport.clientWidth / 2);
          viewport.scrollTop = Math.max(0, height * ratioY - viewport.clientHeight / 2);
        });
      } else {
        requestAnimationFrame(() => {
          viewport.scrollLeft = Math.max(0, (width - viewport.clientWidth) / 2);
          viewport.scrollTop = Math.max(0, (height - viewport.clientHeight) / 2);
        });
      }
    }

    function setZoom(newZoom) {
      const clamped = Math.max(minZoom, Math.min(maxZoom, newZoom));
      if (clamped === zoom) return;
      zoom = clamped;
      renderMap(true);
    }

    function zoomIn() {
      setZoom(zoom + zoomStep);
    }

    function zoomOut() {
      setZoom(zoom - zoomStep);
    }

    function resetZoom() {
      zoom = 1;
      renderMap(true);
    }

    function pan(dx, dy) {
      viewport.scrollBy({
        left: dx,
        top: dy,
        behavior: 'auto'
      });
    }

    document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
    document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
    document.getElementById('resetBtn').addEventListener('click', resetZoom);

    window.addEventListener('resize', () => {
      renderMap(true);
    });

    document.addEventListener('keydown', (e) => {
      const step = 80;

      if (e.key === '+' || e.key === '=') {
        e.preventDefault();
        zoomIn();
        return;
      }

      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        zoomOut();
        return;
      }

      if (e.key === '0') {
        e.preventDefault();
        resetZoom();
        return;
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pan(-step, 0);
        return;
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        pan(step, 0);
        return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        pan(0, -step);
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        pan(0, step);
        return;
      }
    });

    viewport.focus();
    renderMap(false);
  </script>
</body>
</html>
