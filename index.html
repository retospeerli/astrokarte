<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sternenkarte Wädenswil</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: auto;
      background: #000;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #mapFrame {
      display: block;
      border: 0;
      background: #000;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.35;
      user-select: none;
    }

    #controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
    }

    #controls button {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(20,20,20,0.85);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #controls button:hover {
      background: rgba(40,40,40,0.95);
    }
  </style>
</head>
<body>
  <div id="hud">
    Zoom: <span id="zoomLabel">100%</span><br>
    Tasten: + / - / 0 / Pfeile
  </div>

  <div id="controls">
    <button id="zoomOutBtn" aria-label="Verkleinern">−</button>
    <button id="resetBtn" aria-label="Standardgröße">100%</button>
    <button id="zoomInBtn" aria-label="Vergrößern">+</button>
  </div>

  <div id="viewport" tabindex="0">
    <div id="canvas">
      <iframe
        id="mapFrame"
        title="Sternenkarte Wädenswil"
        src="https://www.astroviewer.net/widgets/en/skymap.php?lon=8.6687&lat=47.2267&tz=Europe/Zurich&lang=de&size=1000&bgColor=000000">
      </iframe>
    </div>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    const frame = document.getElementById('mapFrame');
    const zoomLabel = document.getElementById('zoomLabel');

    let zoom = 1;
    const minZoom = 1;
    const maxZoom = 3;
    const zoomStep = 0.25;

    const BASE_SIZE = 1000; // AstroViewer arbeitet robust mit fixer Widget-Größe

    function updateLayout(keepCenter = true) {
      const oldWidth = canvas.offsetWidth || window.innerWidth;
      const oldHeight = canvas.offsetHeight || window.innerHeight;
      const oldCenterX = viewport.scrollLeft + viewport.clientWidth / 2;
      const oldCenterY = viewport.scrollTop + viewport.clientHeight / 2;

      const scaledWidth = Math.round(BASE_SIZE * zoom);
      const scaledHeight = Math.round(BASE_SIZE * zoom);

      const width = Math.max(window.innerWidth, scaledWidth);
      const height = Math.max(window.innerHeight, scaledHeight);

      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      frame.style.width = scaledWidth + 'px';
      frame.style.height = scaledHeight + 'px';

      // Zentriert die Karte innerhalb der verfügbaren Fläche
      frame.style.position = 'absolute';
      frame.style.left = Math.max(0, (width - scaledWidth) / 2) + 'px';
      frame.style.top = Math.max(0, (height - scaledHeight) / 2) + 'px';

      zoomLabel.textContent = Math.round(zoom * 100) + '%';

      if (keepCenter) {
        const ratioX = oldCenterX / oldWidth;
        const ratioY = oldCenterY / oldHeight;

        const newCenterX = width * ratioX;
        const newCenterY = height * ratioY;

        viewport.scrollLeft = Math.max(0, newCenterX - viewport.clientWidth / 2);
        viewport.scrollTop = Math.max(0, newCenterY - viewport.clientHeight / 2);
      } else {
        viewport.scrollLeft = Math.max(0, (width - viewport.clientWidth) / 2);
        viewport.scrollTop = Math.max(0, (height - viewport.clientHeight) / 2);
      }
    }

    function setZoom(value) {
      const next = Math.max(minZoom, Math.min(maxZoom, value));
      if (next === zoom) return;
      zoom = next;
      updateLayout(true);
    }

    function pan(dx, dy) {
      viewport.scrollBy({
        left: dx,
        top: dy,
        behavior: 'auto'
      });
    }

    document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(zoom + zoomStep));
    document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(zoom - zoomStep));
    document.getElementById('resetBtn').addEventListener('click', () => {
      zoom = 1;
      updateLayout(true);
    });

    window.addEventListener('resize', () => updateLayout(true));

    document.addEventListener('keydown', (e) => {
      const step = 80;

      if (e.key === '+' || e.key === '=') {
        e.preventDefault();
        setZoom(zoom + zoomStep);
      } else if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        setZoom(zoom - zoomStep);
      } else if (e.key === '0') {
        e.preventDefault();
        zoom = 1;
        updateLayout(true);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pan(-step, 0);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        pan(step, 0);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        pan(0, -step);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        pan(0, step);
      }
    });

    updateLayout(false);
